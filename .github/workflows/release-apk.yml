name: Build and Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Source
        uses: actions/checkout@v4

      # Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK FIX
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Install SDK Packages
      - name: Install SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Build APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon clean assembleDebug

      # Find APK
      - name: Check APK
        run: |
          mkdir -p release

          APK=$(find . -path "*/build/outputs/apk/*/*.apk" \
            -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND!"
            exit 1
          fi

          cp "$APK" release/Pro-CV-Builder.apk

          ls -lh release/

      # Generate Release Tag
      - name: Generate Release Tag
        id: tag
        run: |
          echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      # Publish Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pro CV Builder ${{ steps.tag.outputs.tag }}
          body: |
            Pro CV Builder Android App

            Release APK
          files: release/Pro-CV-Builder.apk
          make_latest: true
          draft: false
          prerelease: false
