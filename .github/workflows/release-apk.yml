name: Build APK and Publish Release

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download Source Code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 4. Accept Android Licenses
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Build APK
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      # 7. Check APK
      - name: Check APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found!"
            find . -name "*.apk"
            exit 1
          fi

          cp "$APK" Pro-CV-Builder.apk

      # 8. Generate Release Tag
      - name: Generate Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 9. Publish APK Directly to GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pro CV Builder ${{ steps.release_tag.outputs.tag }}
          body: |
            ## Pro CV Builder Android App

            - Android APK
            - Offline CV Builder
            - Professional Resume Maker

            Download Pro-CV-Builder.apk below.
          files: |
            Pro-CV-Builder.apk
          draft: false
          prerelease: false
          make_latest: true
