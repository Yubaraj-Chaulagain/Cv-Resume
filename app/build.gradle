plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fulkumari.procvbuilder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fulkumari.procvbuilder'
        minSdk 23
        targetSdk 35

        versionCode 1
        versionName '1.0.0'
    }

    // Java 17 Configuration
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin 17 Configuration
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
